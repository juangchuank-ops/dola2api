# Dola2API 反向代理配置
#
# 放到 /etc/nginx/conf.d/dola2api.conf（或 sites-available/ 再 ln -s 到
# sites-enabled/），改掉 server_name 和证书路径后 nginx -t 验证。
#
# 这份配置里唯一不能省的是「关闭缓冲」那几行。SSE 流式响应一旦被任何一层
# 缓冲攒住，逐字输出就会变成一次性吐出，看起来像接口卡了很久才回一坨。

upstream dola2api {
    server 127.0.0.1:8080;

    # 复用后端连接。后端是 Go 标准库的 http.Server，支持 keep-alive。
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name dola.example.com;

    # 管理台导入账号时可能一次贴进来很多条，默认 1m 会 413。
    client_max_body_size 16m;

    # 关闭 Nginx 版本号，少暴露一点指纹。
    server_tokens off;

    # 反代到上游时，Host 和真实 IP 都要带过去——后端的访问日志和
    # /debug/pprof 的 loopback 判断都依赖 RemoteAddr。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # HTTP/1.1 + 清空 Connection，否则每个请求都会新建一条到后端的连接。
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 文生视频是异步任务，但 chat/completions 的流式可能持续好几分钟。
    # Nginx 默认 60s 会在响应还没结束时把连接掐掉。
    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # ────────────────────────────────────────────────────────────────
    # SSE 流式：三层缓冲全部关闭
    # ────────────────────────────────────────────────────────────────
    #
    # 1. proxy_buffering      上游响应先攒进内存/临时文件再转发 → 必须 off
    # 2. proxy_request_buffering  请求体先落盘再转发 → 长请求会延迟到达
    # 3. gzip                 压缩本身要凑够一个块才输出 → 对 SSE 必须 off
    #
    # 后两个在流式场景下同样致命，只关 proxy_buffering 是不够的。
    location /v1/ {
        proxy_pass http://dola2api;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        gzip                    off;

        # 让上游的 Transfer-Encoding: chunked 原样透传，而不是被重新分块。
        chunked_transfer_encoding on;

        # 上游如果发了 X-Accel-Buffering: no，Nginx 会自己关缓冲；
        # 但不要依赖它，显式写死更可靠。
        proxy_set_header X-Accel-Buffering no;
    }

    # ────────────────────────────────────────────────────────────────
    # 管理台：默认只对内网开放
    # ────────────────────────────────────────────────────────────────
    #
    # 管理台能读到账号 Cookie 的掩码、改设置、建客户端密钥，别裸奔在公网。
    # 如果一定要公网访问，把下面整段删掉，但请自行加一层认证。
    location /admin/ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;

        proxy_pass http://dola2api;
    }

    # ────────────────────────────────────────────────────────────────
    # 媒体文件：交给 Nginx 直接读盘
    # ────────────────────────────────────────────────────────────────
    #
    # 后端会把上游生成的图片/视频转存到 data/generated/ 下，并通过 /media/
    # 暴露。让 Nginx 直接读文件，省掉 Go 进程搬运字节的开销。
    # 路径按实际部署改；目录里只有生成物，没有凭据，可安全直供。
    location /media/ {
        alias /opt/dola2api/data/generated/;

        # 生成物不带内容 hash（文件名由上游决定），保守给 7 天。
        #
        # 这里刻意不用 try_files：在 alias 上下文里 $uri 是完整 URI，写成
        # `try_files $uri =404` 会去检查 .../generated/media/xxx.png，永远
        # 不存在，于是所有媒体文件都 404。alias 本身已经能把不存在的文件
        # 正确地报成 404，不需要它。
        expires 7d;
    }

    # ────────────────────────────────────────────────────────────────
    # 前端产物：静态直供
    # ────────────────────────────────────────────────────────────────
    #
    # 可选优化。不做的话 / 和 /assets/ 会走后端，后端也会返回正确的缓存头
    # （入口 no-cache、带 hash 的资源 immutable），功能上没有问题。
    # 如果前端 dist 不在这台机器上，删掉这一段。
    location /assets/ {
        alias /opt/dola2api/frontend/dist/assets/;

        # Vite 的产物名带内容 hash，内容变了文件名就变，可以放心长缓存。
        #
        # add_header 会覆盖 expires 生成的那条 Cache-Control，所以值要写全：
        # 只写 "public, immutable" 会把 max-age 一起丢掉，浏览器就退化成
        # 每次重新验证。
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ────────────────────────────────────────────────────────────────
    # 其余请求（/、/health、SPA 回退路由）→ 后端
    # ────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://dola2api;
    }

    # 调试端点只认 loopback（后端自己也会拦），这里再加一道，避免公网扫到。
    location /debug/ {
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://dola2api;
    }
}

# ────────────────────────────────────────────────────────────────────
# HTTPS：强烈建议套上
# ────────────────────────────────────────────────────────────────────
#
# 客户端密钥（sk-dola-xxx）走的是 Authorization 头，明文 HTTP 会在链路上
# 暴露。用 certbot 签一张证书即可：
#
#   certbot --nginx -d dola.example.com
#
# certbot 会自动把上面的 server 块改成 443 + 跳转，并插好 ssl_certificate。
# 注意它有时会在生成的配置里重新打开 proxy_buffering —— 改完检查一遍
# /v1/ 那段是否还留着 off。
